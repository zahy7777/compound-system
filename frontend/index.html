<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compound · 第二版</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
<header><h1>Compound</h1><span>复利事项 · 闭环 · 小事</span><button id="refresh">重新读取</button></header>
<p id="message" role="status" aria-live="polite">正在读取</p>
<section id="view-controls" class="actions">
<label>事项视图<select id="view-select"></select></label>
<button id="new-view">新增视图</button><button id="rename-view">改名视图</button><button id="delete-view">删除视图</button>
</section>
<details><summary>闭环模板</summary><div class="actions"><button id="new-loop-template">新建闭环模板</button>
<label>使用区域<select id="template-area"><option>待办</option><option>结果</option><option>运行</option><option>归档</option></select></label></div><div id="loop-templates"></div></details>
<dialog id="template-dialog"><form id="template-form"><h2>闭环模板</h2>
<label>闭环名称<input id="template-name" required></label><div id="template-events"></div><p id="template-error" role="alert"></p>
<button id="add-draft" type="button">增加小事</button><footer><button id="cancel-template" type="button">取消</button><button type="submit">保存模板</button></footer></form></dialog>
<main id="workspace" aria-label="工作区"></main>
<dialog id="action-dialog" aria-labelledby="action-title">
  <form id="action-form">
    <h2 id="action-title"></h2>
    <label id="action-label">名称<input id="action-name" required autocomplete="off"></label>
    <footer><button type="button" id="action-cancel">取消</button><button type="submit">确定</button></footer>
  </form>
</dialog>
<dialog id="editor">
  <form id="event-form">
    <h2 id="editor-title">小事</h2>
    <p id="editor-error" role="alert"></p>
    <label>小事正文<textarea id="event" rows="4"></textarea></label>
    <div id="tags"></div>
    <button type="button" id="add-tag">增加标签</button>
    <p class="hint">属性支持：日期、评分、耗时、备注。空正文可以保存。</p>
    <footer><button type="button" id="cancel">取消</button><button type="submit">保存小事</button></footer>
  </form>
</dialog>
<script id="protocol" type="application/json">__PROTOCOL__</script>
<script type="module" src="/app.js"></script>
</html>
